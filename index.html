<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pink Scientific Calculator is a premium offline scientific calculator PWA with history, themes, voice input, and bonus tools."
    />
    <meta name="theme-color" content="#ff69b4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pink Scientific Calculator</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icons/icon-192x192.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="loading-screen" id="loadingScreen">
      <div class="loading-ring"></div>
      <p>Preparing your calculator</p>
    </div>

    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>
    <div class="background-glow glow-3"></div>
    <div class="particle-field" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <main class="app-shell">
      <header class="hero-panel">
        <div class="hero-left" aria-hidden="true">
          <div class="balloon balloon-one"></div>
          <div class="balloon balloon-two"></div>
        </div>
        <div class="hero-center">
          <div class="logo-mark">✦</div>
          <div>
            <p class="eyebrow">Premium Offline</p>
            <h1>Pink Scientific Calculator</h1>
          </div>
        </div>
        <div class="hero-right">
          <button class="download-btn" id="installButton" aria-label="Install app">
            <span>⬇</span> Install App
          </button>
          <p class="download-label">Download App From Here</p>
        </div>
      </header>

      <section class="calculator-card">
        <div class="card-top">
          <div class="mode-group">
            <button class="chip active" id="modeToggle" aria-pressed="true">DEG</button>
            <button class="chip" id="themeToggle" aria-label="Toggle light and dark mode">☀️ Light</button>
            <select class="theme-select" id="themeSelector" aria-label="Select calculator theme">
              <option value="glitter">Pink Glitter</option>
              <option value="neon">Pink Neon</option>
              <option value="rose">Rose Gold</option>
              <option value="bubble">Bubble Pink</option>
            </select>
          </div>
          <div class="utility-group">
            <button class="ghost-btn" id="voiceInput">🎤 Voice</button>
            <button class="ghost-btn" id="copyResult">Copy</button>
            <button class="ghost-btn" id="shareResult">Share</button>
          </div>
        </div>

        <section class="display-panel" aria-label="Calculator display">
          <div class="display-top">
            <span class="badge" id="modeBadge">DEG</span>
            <span class="badge subtle" id="statusBadge">Ready</span>
          </div>
          <div class="display-screen">
            <div class="expression" data-expression>0</div>
            <div class="result" data-result>0</div>
          </div>
        </section>

        <div class="memory-row">
          <button class="pill-btn" data-action="memory" data-value="MC">MC</button>
          <button class="pill-btn" data-action="memory" data-value="MR">MR</button>
          <button class="pill-btn" data-action="memory" data-value="M+">M+</button>
          <button class="pill-btn" data-action="memory" data-value="M-">M-</button>
          <button class="pill-btn" data-action="memory" data-value="MS">MS</button>
        </div>

        <section class="keypad" aria-label="Calculator keys">
          <button class="btn func" data-value="π">π</button>
          <button class="btn func" data-value="e">e</button>
          <button class="btn func" data-value="sqrt(">√</button>
          <button class="btn func accent" data-action="clear">C</button>

          <button class="btn func" data-value="sin(">sin</button>
          <button class="btn func" data-value="cos(">cos</button>
          <button class="btn func" data-value="tan(">tan</button>
          <button class="btn func" data-action="backspace">⌫</button>

          <button class="btn func" data-value="cot(">cot</button>
          <button class="btn func" data-value="sec(">sec</button>
          <button class="btn func" data-value="csc(">csc</button>
          <button class="btn func" data-value="log(">log</button>

          <button class="btn func" data-value="ln(">ln</button>
          <button class="btn func" data-value="abs(">|x|</button>
          <button class="btn func" data-value="!">x!</button>
          <button class="btn func" data-value="mod(">mod</button>

          <button class="btn func" data-value="^">xʸ</button>
          <button class="btn func" data-value="exp(">exp</button>
          <button class="btn func" data-value="random()">rand</button>
          <button class="btn func" data-value="(">(</button>

          <button class="btn number" data-value="7">7</button>
          <button class="btn number" data-value="8">8</button>
          <button class="btn number" data-value="9">9</button>
          <button class="btn func" data-value="/">÷</button>

          <button class="btn number" data-value="4">4</button>
          <button class="btn number" data-value="5">5</button>
          <button class="btn number" data-value="6">6</button>
          <button class="btn func" data-value="*">×</button>

          <button class="btn number" data-value="1">1</button>
          <button class="btn number" data-value="2">2</button>
          <button class="btn number" data-value="3">3</button>
          <button class="btn func" data-value="-">−</button>

          <button class="btn number" data-value="0">0</button>
          <button class="btn number" data-value=".">.</button>
          <button class="btn func" data-value="%">%</button>
          <button class="btn func" data-value="+">+</button>

          <button class="btn func" data-value=")">)</button>
          <button class="btn func" data-value="^2">x²</button>
          <button class="btn func" data-value="^3">x³</button>
          <button class="btn equals" data-action="equals">=</button>
        </section>
      </section>

      <aside class="side-panel">
        <section class="history-card">
          <div class="history-header">
            <h2>History</h2>
            <input class="history-search" id="historySearch" type="search" placeholder="Search history" aria-label="Search history" />
          </div>
          <ul class="history-list" id="historyList"></ul>
          <div class="history-footer">
            <button class="ghost-btn" id="exportTxt">Export TXT</button>
            <button class="ghost-btn" id="exportPdf">Export PDF</button>
            <button class="ghost-btn" id="clearHistory">Delete All</button>
          </div>
        </section>

        <section class="tool-card">
          <div class="tool-header">
            <h2>Bonus Tools</h2>
            <p>Fast helpers for everyday maths.</p>
          </div>
          <div class="tool-grid">
            <div class="tool-item">
              <label for="percentAmount">Amount</label>
              <input id="percentAmount" type="number" value="200" />
              <label for="percentRate">Percent</label>
              <input id="percentRate" type="number" value="15" />
              <button class="tool-btn" id="percentCalc">Calculate %</button>
              <div class="tool-result" id="percentResult">Result</div>
            </div>
            <div class="tool-item">
              <label for="unitValue">Value</label>
              <input id="unitValue" type="number" value="1" />
              <label for="unitFrom">From</label>
              <select id="unitFrom">
                <option value="m">Metres</option>
                <option value="km">Kilometres</option>
                <option value="ft">Feet</option>
                <option value="mi">Miles</option>
              </select>
              <label for="unitTo">To</label>
              <select id="unitTo">
                <option value="m">Metres</option>
                <option value="km">Kilometres</option>
                <option value="ft">Feet</option>
                <option value="mi">Miles</option>
              </select>
              <button class="tool-btn" id="unitCalc">Convert</button>
              <div class="tool-result" id="unitResult">Result</div>
            </div>
            <div class="tool-item">
              <label for="dobInput">Date of birth</label>
              <input id="dobInput" type="date" />
              <button class="tool-btn" id="ageCalc">Calculate Age</button>
              <div class="tool-result" id="ageResult">Result</div>
            </div>
            <div class="tool-item">
              <label for="heightInput">Height (m)</label>
              <input id="heightInput" type="number" step="0.01" value="1.7" />
              <label for="weightInput">Weight (kg)</label>
              <input id="weightInput" type="number" step="0.1" value="65" />
              <button class="tool-btn" id="bmiCalc">Calculate BMI</button>
              <div class="tool-result" id="bmiResult">Result</div>
            </div>
            <div class="tool-item">
              <label for="randMin">Min</label>
              <input id="randMin" type="number" value="1" />
              <label for="randMax">Max</label>
              <input id="randMax" type="number" value="100" />
              <button class="tool-btn" id="randCalc">Generate</button>
              <div class="tool-result" id="randResult">Result</div>
            </div>
            <div class="tool-item">
              <label for="dateFrom">From</label>
              <input id="dateFrom" type="date" />
              <label for="dateTo">To</label>
              <input id="dateTo" type="date" />
              <button class="tool-btn" id="dateDiffCalc">Find Days</button>
              <div class="tool-result" id="dateDiffResult">Result</div>
            </div>
          </div>
        </section>
      </aside>
    </main>

    <footer class="footer-bar">
      <span>❤️ Development with Love by Shoo ❤️</span>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
